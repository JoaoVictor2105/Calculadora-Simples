<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Simples</title>
  <meta name="description" content="Calculadora simples construída com HTML, CSS e JavaScript.">
  <meta name="theme-color" content="#1b1c20">

  <!-- Fontes: JetBrains Mono para os números do visor (largura fixa) e Inter para o restante da interface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">
    <h1 class="sr-only">Calculadora Simples</h1>

    <!-- =========================================================
         VISOR (DISPLAY)
         - #previous-operand -> mostra a operação em andamento (ex: "12 +")
         - #display          -> mostra o valor digitado / resultado do cálculo
         ========================================================= -->
    <section class="display">
      <div id="previous-operand" class="display__expression" aria-live="polite"></div>
      <div id="display" class="display__result" aria-live="polite">0</div>
    </section>

    <!-- =========================================================
         TECLADO (números + operadores)
         Botões numéricos usam [data-number] / operadores usam [data-operator]
         ========================================================= -->
    <div class="keypad">

      <!-- Linha 1 — limpar tudo (AC) e operadores de dividir, multiplicar e subtrair -->
      <button type="button" class="btn btn--clear" id="clear" data-action="clear" aria-label="Limpar tudo">AC</button>
      <button type="button" class="btn btn--operator" data-operator="/" aria-label="Dividir">÷</button>
      <button type="button" class="btn btn--operator" data-operator="*" aria-label="Multiplicar">×</button>
      <button type="button" class="btn btn--operator" data-operator="-" aria-label="Subtrair">−</button>

      <!-- Linha 2 — números 7, 8, 9 e operador de somar -->
      <button type="button" class="btn btn--number" data-number="7">7</button>
      <button type="button" class="btn btn--number" data-number="8">8</button>
      <button type="button" class="btn btn--number" data-number="9">9</button>
      <button type="button" class="btn btn--operator" data-operator="+" aria-label="Somar">+</button>

      <!-- Linha 3 — números 4, 5, 6 -->
      <button type="button" class="btn btn--number" data-number="4">4</button>
      <button type="button" class="btn btn--number" data-number="5">5</button>
      <button type="button" class="btn btn--number" data-number="6">6</button>

      <!-- Linha 4 — números 1, 2, 3 e botão de igual -->
      <button type="button" class="btn btn--number" data-number="1">1</button>
      <button type="button" class="btn btn--number" data-number="2">2</button>
      <button type="button" class="btn btn--number" data-number="3">3</button>
      <button type="button" class="btn btn--equals" id="equals" data-action="calculate" aria-label="Calcular resultado">=</button>

      <!-- Linha 5 — número 0 e ponto decimal -->
      <button type="button" class="btn btn--number btn--zero" data-number="0">0</button>
      <button type="button" class="btn btn--decimal" data-action="decimal" aria-label="Ponto decimal">.</button>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
